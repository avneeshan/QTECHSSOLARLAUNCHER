<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Q Techs Solar — We're Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:    #0d5c5c;
      --teal-hi: #1a9090;
      --orange:  #e07b39;
      --ore-hi:  #ff9a50;
      --bg:      #04100f;
      --white:   #f0faf8;
    }

    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); cursor:none; }

    /* Custom cursor */
    #cursor {
      position:fixed; width:12px; height:12px; border-radius:50%;
      background:var(--orange); pointer-events:none; z-index:9999;
      transform:translate(-50%,-50%);
      transition:transform .1s;
      mix-blend-mode:screen;
    }
    #cursor-ring {
      position:fixed; width:36px; height:36px; border-radius:50%;
      border:1px solid rgba(224,123,57,.4); pointer-events:none; z-index:9998;
      transform:translate(-50%,-50%);
      transition:transform .18s, width .2s, height .2s;
    }

    /* ════════════════════════════
       SCREEN SYSTEM
    ════════════════════════════ */
    .screen {
      position:fixed; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
    }

    /* ════════════════════════════
       LAUNCH SCREEN
    ════════════════════════════ */
    #launch-screen { z-index:2; }

    /* Layered background */
    .bg-layer {
      position:absolute; inset:0; overflow:hidden;
    }

    /* Deep space gradient */
    .bg-layer::before {
      content:'';
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse 80% 60% at 60% 40%, rgba(13,92,92,.45) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(224,123,57,.08) 0%, transparent 55%),
        linear-gradient(170deg, #04100f 0%, #061a18 50%, #04100f 100%);
    }

    /* Particle stars */
    .bg-layer::after {
      content:'';
      position:absolute; inset:0;
      background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 8%,  rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 5%,  rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 55%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(2px 2px at 25% 45%, rgba(26,144,144,.8) 0%, transparent 100%),
        radial-gradient(2px 2px at 70% 35%, rgba(224,123,57,.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 5% 90%, rgba(26,144,144,.5) 0%, transparent 100%);
    }

    /* Animated solar scan line */
    .scan-line {
      position:absolute; left:0; right:0; height:1px;
      background:linear-gradient(90deg, transparent 0%, rgba(26,144,144,.4) 30%, rgba(224,123,57,.6) 50%, rgba(26,144,144,.4) 70%, transparent 100%);
      animation:scan 6s linear infinite;
      top:0;
    }
    @keyframes scan { 0%{top:-2px} 100%{top:100%} }

    /* Corner brackets */
    .bracket {
      position:absolute;
      width:50px; height:50px;
      border-color:rgba(26,144,144,.35);
      border-style:solid;
    }
    .bracket.tl { top:28px; left:28px; border-width:1px 0 0 1px; }
    .bracket.tr { top:28px; right:28px; border-width:1px 1px 0 0; }
    .bracket.bl { bottom:28px; left:28px; border-width:0 0 1px 1px; }
    .bracket.br { bottom:28px; right:28px; border-width:0 1px 1px 0; }

    /* ── Centered content ── */
    .launch-inner {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      align-items:center;
      text-align:center;
      gap:0;
    }

    /* LIVE badge */
    .live-badge {
      display:inline-flex; align-items:center; gap:.5rem;
      border:1px solid rgba(224,123,57,.4);
      border-radius:2px;
      padding:.28rem .9rem;
      font-family:'DM Sans', sans-serif;
      font-size:.62rem;
      letter-spacing:.35em;
      text-transform:uppercase;
      color:var(--ore-hi);
      margin-bottom:2.2rem;
      animation:fadeIn .8s .1s both;
    }
    .live-dot {
      width:6px; height:6px; border-radius:50%;
      background:var(--orange);
      box-shadow:0 0 8px var(--orange);
      animation:blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* Giant announcement text */
    .announce-line {
      font-family:'DM Sans', sans-serif;
      font-weight:300;
      font-size:clamp(.75rem, 1.2vw, .9rem);
      letter-spacing:.55em;
      text-transform:uppercase;
      color:rgba(240,250,248,.35);
      animation:fadeIn .8s .2s both;
      margin-bottom:.9rem;
    }

    .headline {
      font-family:'Bebas Neue', sans-serif;
      font-size:clamp(5rem, 14vw, 11rem);
      line-height:.88;
      color:var(--white);
      letter-spacing:.04em;
      animation:riseUp .9s .25s cubic-bezier(.22,1,.36,1) both;
    }

    .headline .solar {
      display:block;
      -webkit-text-stroke: 1px rgba(26,144,144,.6);
      color:transparent;
      background:linear-gradient(135deg, var(--teal-hi) 0%, var(--ore-hi) 60%, var(--teal-hi) 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .headline-sub {
      font-family:'DM Sans', sans-serif;
      font-weight:300;
      font-size:clamp(.75rem, 1.1vw, .88rem);
      letter-spacing:.4em;
      text-transform:uppercase;
      color:rgba(240,250,248,.3);
      margin-top:1.2rem;
      animation:fadeIn .8s .5s both;
    }

    /* ── Play button ── */
    .play-area {
      margin-top:3.2rem;
      display:flex; flex-direction:column; align-items:center; gap:1.2rem;
      animation:fadeIn .8s .6s both;
    }

    .play-btn {
      position:relative;
      width:82px; height:82px;
      border-radius:50%; border:none; cursor:none;
      background:transparent;
      display:flex; align-items:center; justify-content:center;
      outline:none;
      -webkit-tap-highlight-color:transparent;
    }

    /* Animated glow ring behind button */
    .play-btn::before {
      content:'';
      position:absolute; inset:-16px;
      border-radius:50%;
      border:1px solid rgba(224,123,57,.25);
      animation:spin-ring 8s linear infinite;
    }
    .play-btn::after {
      content:'';
      position:absolute; inset:-30px;
      border-radius:50%;
      border:1px dashed rgba(26,144,144,.2);
      animation:spin-ring 14s linear infinite reverse;
    }

    @keyframes spin-ring { to{transform:rotate(360deg)} }

    .play-inner {
      width:82px; height:82px; border-radius:50%;
      background:var(--orange);
      display:flex; align-items:center; justify-content:center;
      box-shadow:
        0 0 30px rgba(224,123,57,.4),
        0 0 60px rgba(224,123,57,.15),
        inset 0 1px 0 rgba(255,255,255,.25);
      transition:transform .22s, box-shadow .22s;
    }

    .play-btn:hover .play-inner {
      transform:scale(1.1);
      box-shadow:
        0 0 50px rgba(224,123,57,.6),
        0 0 100px rgba(224,123,57,.25);
    }

    .play-btn:active .play-inner { transform:scale(.94); }

    .triangle {
      width:0; height:0;
      border-style:solid;
      border-width:12px 0 12px 22px;
      border-color:transparent transparent transparent rgba(255,255,255,.95);
      margin-left:6px;
    }

    .play-hint {
      font-family:'DM Sans', sans-serif;
      font-size:.62rem;
      letter-spacing:.35em;
      text-transform:uppercase;
      color:rgba(240,250,248,.3);
    }

    /* ── Bottom domain strip ── */
    .domain-strip {
      position:absolute; bottom:36px;
      left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:1rem;
      animation:fadeIn 1s .8s both;
    }

    .domain-line { width:60px; height:1px; background:rgba(26,144,144,.25); }

    .domain-text {
      font-family:'DM Sans', sans-serif;
      font-size:.68rem;
      letter-spacing:.3em;
      text-transform:uppercase;
      color:rgba(240,250,248,.25);
    }

    /* ════════════════════════════
       VIDEO SCREEN
    ════════════════════════════ */
    #video-screen {
      z-index:20; background:#000;
      opacity:0; pointer-events:none;
      transition:opacity .6s ease;
    }
    #video-screen.active { opacity:1; pointer-events:all; }

    #promo-video {
      width:100%; height:100%;
      object-fit:contain; background:#000;
    }

    /* ════════════════════════════
       LAUNCH REVEAL OVERLAY
    ════════════════════════════ */
    #reveal-overlay {
      position:fixed; inset:0; z-index:50;
      background:var(--bg);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      opacity:0; pointer-events:none;
      transition:opacity .5s;
    }
    #reveal-overlay.show { opacity:1; pointer-events:all; }

    .reveal-eyebrow {
      font-family:'DM Sans', sans-serif;
      font-size:.65rem; letter-spacing:.5em;
      text-transform:uppercase;
      color:rgba(240,250,248,.3);
      margin-bottom:1.5rem;
    }

    .reveal-title {
      font-family:'Bebas Neue', sans-serif;
      font-size:clamp(3rem, 8vw, 6.5rem);
      letter-spacing:.06em;
      color:var(--white);
      line-height:1;
      text-align:center;
    }

    .reveal-title .highlight {
      color:var(--ore-hi);
    }

    .reveal-url {
      font-family:'DM Sans', sans-serif;
      font-size:.8rem; letter-spacing:.25em;
      text-transform:lowercase;
      color:var(--teal-hi);
      margin-top:1rem;
    }

    /* Progress bar */
    .progress-wrap {
      width:240px; height:2px;
      background:rgba(255,255,255,.07);
      border-radius:1px;
      margin-top:2.5rem;
      overflow:hidden;
    }

    .progress-fill {
      height:100%;
      background:linear-gradient(90deg, var(--teal-hi), var(--ore-hi));
      width:0%;
      transition:width 2.5s cubic-bezier(.4,0,.2,1);
    }

    .progress-label {
      font-family:'DM Sans', sans-serif;
      font-size:.58rem; letter-spacing:.3em;
      text-transform:uppercase;
      color:rgba(240,250,248,.2);
      margin-top:.8rem;
    }

    /* Shared animations */
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes riseUp {
      from { opacity:0; transform:translateY(40px) skewY(1deg); }
      to   { opacity:1; transform:translateY(0) skewY(0deg); }
    }
  </style>
</head>
<body>

  <!-- Custom cursor -->
  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <!-- ── LAUNCH SCREEN ── -->
  <div class="screen" id="launch-screen">
    <div class="bg-layer"></div>
    <div class="scan-line"></div>

    <!-- Corner brackets -->
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <div class="launch-inner">
      <div class="live-badge">
        <div class="live-dot"></div>
        Now Live
      </div>

      <div class="announce-line">We are proud to announce</div>

      <div class="headline">
        Q Techs<br/>
        <span class="solar">Solar.</span>
      </div>

      <div class="headline-sub">Current Into Time &nbsp;·&nbsp; Official Website Launch</div>

      <div class="play-area">
        <button class="play-btn" id="playBtn" aria-label="Watch launch video">
          <div class="play-inner">
            <div class="triangle"></div>
          </div>
        </button>
        <div class="play-hint">Watch launch video</div>
      </div>
    </div>

    <div class="domain-strip">
      <div class="domain-line"></div>
      <div class="domain-text">www.qtechssolar.com</div>
      <div class="domain-line"></div>
    </div>
  </div>

  <!-- ── VIDEO SCREEN ── -->
  <div class="screen" id="video-screen">
    <video id="promo-video" playsinline>
      <source src="q_tech_solar.mp4" type="video/mp4"/>
    </video>
  </div>

  <!-- ── REVEAL OVERLAY ── -->
  <div id="reveal-overlay">
    <div class="reveal-eyebrow">The wait is over</div>
    <div class="reveal-title">
      We're<br/><span class="highlight">Live.</span>
    </div>
    <div class="reveal-url">www.qtechssolar.com</div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label">Launching website…</div>
  </div>

  <script>
    // Cursor
    const cursor = document.getElementById('cursor');
    const ring   = document.getElementById('cursor-ring');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
      setTimeout(() => {
        ring.style.left = e.clientX + 'px';
        ring.style.top  = e.clientY + 'px';
      }, 60);
    });

    // Hover expand ring on button
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('mouseenter', () => {
      ring.style.width = '60px'; ring.style.height = '60px';
    });
    playBtn.addEventListener('mouseleave', () => {
      ring.style.width = '36px'; ring.style.height = '36px';
    });

    // Flow
    const launchScreen = document.getElementById('launch-screen');
    const videoScreen  = document.getElementById('video-screen');
    const video        = document.getElementById('promo-video');
    const overlay      = document.getElementById('reveal-overlay');
    const fill         = document.getElementById('progressFill');

    playBtn.addEventListener('click', () => {
      launchScreen.style.opacity = '0';
      launchScreen.style.pointerEvents = 'none';
      setTimeout(() => { launchScreen.style.display = 'none'; }, 600);
      videoScreen.classList.add('active');
      video.play();
    });

    video.addEventListener('ended', () => {
      videoScreen.style.opacity = '0';
      setTimeout(() => {
        overlay.classList.add('show');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          fill.style.width = '100%';
        }));
        setTimeout(() => {
          window.location.href = 'https://www.qtechssolar.com';
        }, 2800);
      }, 400);
    });
  </script>
</body>
</html>
